title: CVPR 2025 DriveX Grand Challenge - TUMTraf V2X Cooperative Perception Dataset
short_description: 3D Perception Challenge for Autonomous Driving Using the TUMTraf V2X Cooperative Perception Dataset
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
leaderboard_description: The leaderboard description provides an overview of the evaluation metrics and their significance in assessing the performance of the models in the challenge. It outlines the key metrics used for evaluation, such as Precision, Recall, 3D IoU, Position RMSE, Rotation RMSE, and 3D mAP, along with their definitions and implications for model performance.
evaluation_script: evaluation_script.zip
remote_evaluation: False
start_date: 2025-03-17 23:59:59
end_date: 2025-05-26 23:59:59
published: True

leaderboard:
  - id: 1
    schema:
      {
        "labels": ["Precision", "Recall", "3D_IoU", "Position_RMSE","Rotation_RMSE","3D_mAP"],
        "default_order_by": "3D_mAP",
        "metadata": {
          "Precision": {
            "sort_ascending": True,
            "description": "The ratio of correctly detected objects to the total number of actual objects,
        assessing the model's ability to find all relevant instances..",
          },
          "Recall": {
            "sort_ascending": True,
            "description": "The ratio of correctly detected objects to the total number of actual objects,
        assessing the model's ability to find all relevant instances.",
          },
          "3D IoU (Intersection over Union)": {
            "sort_ascending": True,
            "description": "The ratio of the intersection volume to the union volume
        between a predicted and a ground truth 3D bounding box, measuring spatial overlap.",
          },
          "Position RMSE (Root Mean Squared Error)": {
            "sort_ascending": False,
            "description": "The square root of the mean squared differences
        between predicted and ground truth positions, evaluating localization accuracy.",
          },
          "Rotation RMSE": {
            "sort_ascending": False,
            "description": "The square root of the mean squared differences between predicted and ground
        truth rotations, quantifying angular estimation errors.",
          },
          "3D mAP (Mean Average Precision)": {
            "sort_ascending": True,
            "description": "The average precision across different intersection-over-union
        (IoU) thresholds in 3D object detection, reflecting overall detection performance..",
          },
        }
      }

challenge_phases:
  - id: 1
    name: Test Phase
    description: templates/challenge_description.html
    leaderboard_public: True
